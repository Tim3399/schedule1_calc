name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned tools and application dependencies
        shell: bash
        run: |
          npm install --global "npm@$(node -p 'require("./tools/toolchains.json").npm')"
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install -r requirements-dev.txt
      - name: Check formatting, pins, version consistency and Python syntax
        run: python tools/project.py check
      - name: Test project tooling
        run: python tools/project.py test
