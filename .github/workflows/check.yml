name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.8"
          activate-environment: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned tools and application dependencies
        shell: bash
        run: |
          npm install --global "npm@$(node -p 'require("./tools/toolchains.json").npm')"
          npm ci --ignore-scripts --no-audit --no-fund
          uv pip install -r requirements-dev.txt
      - name: Check formatting, pins, version consistency and Python syntax
        run: python tools/project.py check
      - name: Test project tooling
        run: python tools/project.py test
