name: Set up project tools
description: Install the declared runtimes and locked development dependencies.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.12.8"
        activate-environment: true
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: npm
        package-manager-cache: false
    - name: Install pinned tools and application dependencies
      shell: bash
      run: |
        npm install --global "npm@$(node -p 'require("./tools/toolchains.json").npm')"
        npm ci --ignore-scripts --no-audit --no-fund
        uv pip install -r requirements-dev.txt
